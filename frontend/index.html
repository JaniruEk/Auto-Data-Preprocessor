<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CSV Auto Preprocess & Visualize</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.34.0/plotly.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div class="max-w-7xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-4">CSV Auto Preprocess & Visualize</h1>

    <div class="bg-white border rounded p-4 mb-6">
      <form id="uploadForm" class="flex gap-3 items-center">
        <input id="fileInput" type="file" accept=".csv" class="file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200" />
        <button id="uploadBtn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700" type="submit">Upload CSV</button>
        <span id="uploadStatus" class="text-sm text-slate-600"></span>
      </form>
    </div>

    <div id="datasetSection" class="hidden">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
        <div class="bg-white border rounded p-4">
          <div class="text-slate-500">Rows</div>
          <div id="rowsStat" class="text-3xl font-semibold">-</div>
        </div>
        <div class="bg-white border rounded p-4">
          <div class="text-slate-500">Columns</div>
          <div id="colsStat" class="text-3xl font-semibold">-</div>
        </div>
        <div class="bg-white border rounded p-4">
          <div class="text-slate-500">Top Correlations</div>
          <div id="corrStat" class="text-sm">-</div>
        </div>
      </div>

      <div class="bg-white border rounded p-4 mb-6">
        <h2 class="text-lg font-semibold mb-3">Preview</h2>
        <div id="previewTable" class="overflow-auto"></div>
      </div>

      <div class="bg-white border rounded p-4 mb-6">
        <h2 class="text-lg font-semibold mb-3">Histograms</h2>
        <div id="hists" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>

      <div class="bg-white border rounded p-4 mb-6">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-lg font-semibold">Auto Preprocess</h2>
          <label class="inline-flex items-center gap-2 text-sm">
            <input id="scaleToggle" type="checkbox" checked /> Scale numeric
          </label>
        </div>
        <button id="preprocessBtn" class="px-4 py-2 bg-emerald-600 text-white rounded hover:bg-emerald-700">Run Preprocess</button>
        <span id="preprocessStatus" class="ml-3 text-sm text-slate-600"></span>
        <div id="processedPreview" class="mt-4"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
<!-- React entrypoint, see src/main.jsx -->
